<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: Roboto;
  src: url("../../docs/tsehosense-watch-graphics-spec-v1/fonts/source/roboto-latin-500-normal.woff2") format("woff2");
  font-weight: 500;
}
@font-face {
  font-family: Roboto;
  src: url("../../docs/tsehosense-watch-graphics-spec-v1/fonts/source/roboto-latin-600-normal.woff2") format("woff2");
  font-weight: 600;
}
@font-face {
  font-family: Roboto;
  src: url("../../docs/tsehosense-watch-graphics-spec-v1/fonts/source/roboto-latin-700-normal.woff2") format("woff2");
  font-weight: 700;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 256px;
  height: 256px;
  overflow: hidden;
  background: #151717;
}
button {
  padding: 0;
  color: inherit;
  background: transparent;
  border: 0;
  font: inherit;
}
.face {
  position: relative;
  width: 256px;
  height: 256px;
  overflow: hidden;
  border-radius: 50%;
  color: #fff;
  background: #000;
  font-family: Roboto, Arial, sans-serif;
}
.time-zone {
  position: absolute;
  top: 18px;
  left: 37px;
  width: 182px;
  height: 66px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.time {
  font-size: 68px;
  font-weight: 700;
  line-height: .9;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.line {
  position: absolute;
  left: 28px;
  width: 200px;
  height: 2px;
  background: #767676;
}
.line.top { top: 88px; }
.line.middle { top: 133px; }
.status {
  position: absolute;
  top: 90px;
  left: 29px;
  width: 198px;
  height: 41px;
  display: grid;
  grid-template-columns: 98px 2px 98px;
}
.status-cell {
  min-height: 41px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 24px;
  font-weight: 600;
  line-height: 1;
}
.status-cell svg {
  width: 27px;
  height: 27px;
  flex: none;
}
.status-divider {
  width: 2px;
  height: 32px;
  align-self: center;
  background: #767676;
}
.device {
  position: absolute;
  top: 136px;
  left: 28px;
  width: 200px;
  height: 67px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-align: left;
}
.device-copy {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.device-copy strong {
  font-size: 42px;
  font-weight: 700;
  line-height: .82;
  letter-spacing: -.015em;
}
.device-copy small {
  margin-top: 5px;
  color: #9d9d9d;
  font-size: 17px;
  font-weight: 500;
  line-height: 1;
}
.device > svg {
  width: 29px;
  height: 29px;
}
.bottom {
  position: absolute;
  left: 54px;
  right: 54px;
  bottom: 18px;
  height: 35px;
  display: grid;
  grid-template-columns: 45px 58px 45px;
  align-items: center;
}
.counter {
  min-height: 35px;
  display: flex;
  align-items: center;
  gap: 2px;
  font-size: 20px;
  font-weight: 500;
}
.counter svg { width: 23px; height: 23px; }
.nearby {
  min-height: 35px;
  color: #a4a4a4;
  font-size: 14px;
  font-weight: 500;
  text-align: center;
}
.ecosystem { justify-content: flex-end; }
.ecosystem-mark {
  position: relative;
  width: 25px;
  height: 25px;
  display: inline-grid;
  place-items: center;
}
.ecosystem-mark svg { width: 25px; height: 25px; }
.ecosystem-mark::after {
  content: "";
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
</style>
</head>

</body>
</html>
